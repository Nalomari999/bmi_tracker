<!DOCTYPE html>

<html>
<head>
    <title>Forgot Password</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>
    .reset-note {
        font-size: 13px;
        color: #777;
        margin-top: 6px;
    }
</style>

</head>
<body>

<!-- Top navigation -->
<div class="navbar">
    <div class="logo">
        BMI Tracker
    </div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/login">Login</a>

        <!-- Added class separately for readability -->
        <a href="/signup" class="nav-btn">Sign Up</a>
    </div>
</div>

<div class="page-container">

    <div class="card form-card">

        <h1>Reset Password</h1>

        <!-- Step 1 is user enters username, Step 2 verifies security question + update password-->

        {% if step == 1 %}

        <form method="POST">

            <input type="hidden" name="step" value="1">

            <label for="usernameInput">Username:</label>

            <input
                type="text"
                id="usernameInput"
                name="username"
                value="{{ username }}"
                required
            >

            <p class="reset-note">
                Enter the username connected to your account.
            </p>

            <div style="margin-top:24px;">
                <button type="submit" class="form-btn">
                    Find Account
                </button>
            </div>

        </form>

        {% else %}

        <form method="POST">

            <!-- keeping hidden fields grouped together -->
            <input type="hidden" name="step" value="2">
            <input type="hidden" name="username" value="{{ username }}">

            <label>Username:</label>

            <!-- disabled because user shouldn't edit it here -->
            <input type="text" value="{{ username }}" disabled>

            <div class="message-box">

                <!-- Could probably style this nicer later -->
                <p>
                    <strong>Security Question:</strong>
                    {{ security_q }}
                </p>

            </div>

            <label for="securityAnswer">Security Answer:</label>

            <input
                type="text"
                name="security_a"
                id="securityAnswer"
                required
            >

            <label for="newPassword">New Password:</label>

            <input
                type="password"
                name="new_password"
                id="newPassword"
                required
            >

            <label for="confirmPassword">Confirm New Password:</label>

            <input
                type="password"
                name="confirm_password"
                id="confirmPassword"
                required
            >

            <div style="margin-top: 24px;">
                <button class="form-btn" type="submit">
                    Reset Password
                </button>
            </div>

        </form>

        {% endif %}

        {% if message %}

        <div class="message-box">
            <p>
                <strong>{{ message }}</strong>
            </p>
        </div>

        {% endif %}

        <div class="auth-links">

            <!-- simple back navigation -->
            <a href="/login">
                Back to Login
            </a>

        </div>

    </div>

</div>

</body>
</html>
